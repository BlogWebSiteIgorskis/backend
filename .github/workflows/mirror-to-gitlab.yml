name: Mirror to GitLab dev

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab dev branch
        run: |
          git config user.email "mirror@ci.com"
          git config user.name "Mirror Bot"

          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@${{ secrets.GITLAB_REPO }}

          git push gitlab HEAD:refs/heads/dev --force
